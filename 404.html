<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>הדף לא נמצא · רגע למוח</title>
  <link rel="icon" href="/RegaLamoah/favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #edf2f0; --ink: #17282b; --soft: #4a5d60; --accent: #0d6b66; --accent-ink: #fff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #101a1c; --ink: #e8f0ee; --soft: #a9bbb8; --accent: #4fc0b6; --accent-ink: #0b1a1b; color-scheme: dark; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
      font-family: "Assistant", "Arial Hebrew", "Segoe UI", Arial, sans-serif; font-size: 20px; text-align: center; padding: 16px; }
    h1 { font-size: 2rem; margin: 0 0 .5rem; }
    p { color: var(--soft); margin: 0 0 1.5rem; }
    a { display: inline-block; background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 700;
      padding: .8rem 1.8rem; border-radius: 999px; }
  </style>
</head>
<body>
  <main>
    <h1>הדף הזה לא נמצא</h1>
    <p>אולי הקישור השתנה. אפשר לחזור לדף הבית ולהמשיך להתאמן.</p>
    <a href="/RegaLamoah/">לדף הבית של רגע למוח</a>
  </main>
</body>
</html>
